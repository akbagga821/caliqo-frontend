<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join the waitlist — Caliqo</title>
  <link rel="icon" href="/caliqo_logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=DM+Sans:ital,wght@0,400;0,500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-dark: #0a0b0d;
      --text-primary: #f0f0f0;
      --text-secondary: #9ca3af;
      --accent: #7c9ce0;
      --orange: #c95410;
    }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .wrap {
      width: 100%;
      max-width: 28rem;
      text-align: center;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .sub {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: left;
    }
    label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      display: block;
      margin-bottom: 0.35rem;
    }
    input[type="email"],
    input[type="text"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 1rem;
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      transition: border-color 0.2s, background 0.2s;
    }
    input[type="email"]:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: var(--orange);
      background: rgba(255, 255, 255, 0.08);
    }
    input::placeholder {
      color: rgba(156, 163, 175, 0.6);
    }
    .btn {
      display: inline-block;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      background: var(--orange);
      border: 1px solid var(--orange);
      border-radius: 6px;
      padding: 0.85rem 1.5rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      margin-top: 0.5rem;
    }
    .btn:hover {
      background: #d85f12;
      border-color: #d85f12;
    }
    .btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <iframe name="waitlist-target" id="waitlist-target" style="display:none" title="Form submission"></iframe>
  <div class="wrap">
    <div id="form-view">
      <h1>Join the waitlist</h1>
      <p class="sub">Be the first to know when Caliqo is ready. We’ll only use your email to notify you.</p>
      <form class="form" id="waitlist-form" action="https://script.google.com/macros/s/AKfycbxSr8EakK5up3GAewSp0ibvdxsgXTAImBGtZybQxFA5nKd2bLiBRo90yDREkyxOKS40/exec" method="post" target="waitlist-target">
        <input type="hidden" name="redirect" id="redirect-url" value="" />
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@company.com" required />
        </div>
        <div>
          <label for="name">Name <span style="color: var(--text-secondary); font-weight: 400;">(optional)</span></label>
          <input type="text" id="name" name="name" placeholder="Your name" />
        </div>
        <button type="submit" class="btn" id="submit-btn">Submit</button>
      </form>
    </div>
    <div id="thankyou-view" style="display: none;">
      <h1>You're on the list</h1>
      <p class="sub">Thanks for signing up. We'll be in touch.</p>
      <a href="/" class="btn">← Back to Caliqo</a>
    </div>
  </div>
  <script>
    (function() {
      var form = document.getElementById('waitlist-form');
      var formView = document.getElementById('form-view');
      var thankyouView = document.getElementById('thankyou-view');
      var submitBtn = document.getElementById('submit-btn');
      var iframe = document.getElementById('waitlist-target');
      var thankYouUrl = window.location.origin + window.location.pathname + '?thankyou=1';

      if (new URLSearchParams(window.location.search).get('thankyou') === '1') {
        formView.style.display = 'none';
        thankyouView.style.display = 'block';
        return;
      }

      document.getElementById('redirect-url').value = thankYouUrl;

      form.addEventListener('submit', function() {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting…';
        function onIframeLoad() {
          iframe.removeEventListener('load', onIframeLoad);
          window.location = thankYouUrl;
        }
        iframe.addEventListener('load', onIframeLoad);
      });
    })();
  </script>
</body>
</html>
